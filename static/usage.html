<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2324292f'/%3E%3Cpath d='M18 44V30h8v14h-8Zm10 0V18h8v26h-8Zm10 0V25h8v19h-8Z' fill='%23ffffff'/%3E%3Cpath d='M17 49h30' stroke='%232da44e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>CLIProxyAPI Usage</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --canvas: #ffffff;
      --canvas-subtle: #f6f8fa;
      --border: #d0d7de;
      --border-muted: #d8dee4;
      --fg: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
      --accent-bg: #ddf4ff;
      --success: #1a7f37;
      --danger: #cf222e;
      --shadow: 0 1px 2px rgba(31, 35, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    .topbar {
      background: #24292f;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .topbar-inner {
      width: 100%;
      margin: 0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: #24292f;
      font-weight: 700;
    }

    .topbar h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 600;
    }

    .topbar p {
      margin: 2px 0 0;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
    }

    main {
      width: 100%;
      margin: 0;
      padding: 24px;
    }

    .toolbar,
    .panel {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .toolbar {
      padding: 16px;
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(260px, 1.4fr) minmax(260px, 1fr) minmax(130px, 0.3fr) auto auto;
      align-items: end;
    }

    .toolbar > *,
    .grid > * {
      min-width: 0;
    }

    label {
      display: block;
      color: var(--fg);
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      min-height: 34px;
      padding: 6px 10px;
      color: var(--fg);
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.18);
    }

    .btn {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid rgba(31,35,40,0.15);
      border-radius: 6px;
      background: #f6f8fa;
      color: var(--fg);
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn.primary {
      background: #2da44e;
      border-color: rgba(31,35,40,0.15);
      color: #fff;
    }

    .btn:hover { filter: brightness(0.97); }
    .btn:disabled { opacity: 0.58; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 20px;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: var(--success); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .stat {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .stat .value {
      margin-top: 6px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(380px, 0.8fr) minmax(620px, 1.6fr);
      gap: 16px;
      align-items: start;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-muted);
      background: var(--canvas-subtle);
      border-radius: 6px 6px 0 0;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .panel-header .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 330px);
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--canvas);
    }

    th, td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-muted);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--canvas-subtle);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    tbody tr:hover { background: #f6f8fa; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
    }

    .account {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      max-width: 220px;
      min-height: 22px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: #0550ae;
      border: 1px solid rgba(9,105,218,0.14);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) minmax(180px, 1fr);
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-muted);
    }

    @media (max-width: 980px) {
      .toolbar,
      .grid,
      .stats,
      .filters {
        grid-template-columns: 1fr;
      }

      main { padding: 16px; }
      .table-wrap { max-height: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="mark">U</div>
      <div>
        <h1>CLIProxyAPI Usage</h1>
        <p>In-memory usage dashboard, GitHub style</p>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="连接设置">
      <div>
        <label for="baseUrl">管理 API 地址</label>
        <input id="baseUrl" value="http://127.0.0.1:8317/v0/management" placeholder="http://127.0.0.1:8317/v0/management" />
      </div>
      <div>
        <label for="managementKey">Management key</label>
        <input id="managementKey" type="password" autocomplete="current-password" value="" placeholder="输入管理密钥" />
      </div>
      <div>
        <label for="queueCount">明细读取条数</label>
        <input id="queueCount" type="number" min="1" max="5000" step="1" value="1000" />
      </div>
      <button id="refreshBtn" class="btn primary">刷新统计</button>
      <button id="clearBtn" class="btn">清空页面</button>
    </section>
    <div id="status" class="status">页面只保存在当前浏览器标签页内；/usage-queue 被读取后，服务端队列中的对应记录会被移除。</div>

    <section class="stats" aria-label="总览">
      <div class="stat">
        <div class="label">认证账号</div>
        <div id="statAccounts" class="value">0</div>
      </div>
      <div class="stat">
        <div class="label">输入 token</div>
        <div id="statInput" class="value">0</div>
      </div>
      <div class="stat">
        <div class="label">输出 token</div>
        <div id="statOutput" class="value">0</div>
      </div>
      <div class="stat">
        <div class="label">缓存命中率</div>
        <div id="statCache" class="value">0%</div>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <div class="panel-header">
          <h2>按认证账号统计</h2>
          <span id="accountHint" class="hint">0 rows</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>账号</th>
                <th>请求</th>
                <th>输入</th>
                <th>输出</th>
                <th>缓存命中</th>
              </tr>
            </thead>
            <tbody id="accountRows"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>使用明细</h2>
          <span id="detailHint" class="hint">0 rows</span>
        </div>
        <div class="filters">
          <div>
            <label for="accountFilter">账号</label>
            <select id="accountFilter"><option value="">全部账号</option></select>
          </div>
          <div>
            <label for="modelFilter">模型</label>
            <select id="modelFilter"><option value="">全部模型</option></select>
          </div>
          <div>
            <label for="searchFilter">搜索</label>
            <input id="searchFilter" placeholder="provider / endpoint / request id" />
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>账号</th>
                <th>模型</th>
                <th>输入</th>
                <th>输出</th>
                <th>缓存</th>
                <th>命中率</th>
                <th>Provider</th>
                <th>Endpoint</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="detailRows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      records: [],
      accounts: [],
      models: [],
      raw: null
    };

    const els = {
      baseUrl: document.getElementById('baseUrl'),
      managementKey: document.getElementById('managementKey'),
      queueCount: document.getElementById('queueCount'),
      refreshBtn: document.getElementById('refreshBtn'),
      clearBtn: document.getElementById('clearBtn'),
      status: document.getElementById('status'),
      statAccounts: document.getElementById('statAccounts'),
      statInput: document.getElementById('statInput'),
      statOutput: document.getElementById('statOutput'),
      statCache: document.getElementById('statCache'),
      accountRows: document.getElementById('accountRows'),
      detailRows: document.getElementById('detailRows'),
      accountHint: document.getElementById('accountHint'),
      detailHint: document.getElementById('detailHint'),
      accountFilter: document.getElementById('accountFilter'),
      modelFilter: document.getElementById('modelFilter'),
      searchFilter: document.getElementById('searchFilter')
    };

    function defaultBaseUrl() {
      return 'http://127.0.0.1:8317/v0/management';
    }

    function setStatus(message, kind = '') {
      els.status.textContent = message;
      els.status.className = `status ${kind}`.trim();
    }

    function fmt(value) {
      return Number(value || 0).toLocaleString('en-US');
    }

    function pct(part, total) {
      if (!total) return '0%';
      return `${((part / total) * 100).toFixed(1)}%`;
    }

    function text(value) {
      return value === null || value === undefined || value === '' ? '-' : String(value);
    }

    function formatTime(value) {
      if (!value) return '-';
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      const pad = number => String(number).padStart(2, '0');
      return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function normalizeBaseUrl(value) {
      let url = (value || '').trim() || defaultBaseUrl();
      url = url.replace(/\/$/, '');
      if (!/\/v0\/management$/.test(url)) url += '/v0/management';
      return url;
    }

    async function apiGet(path) {
      const base = normalizeBaseUrl(els.baseUrl.value);
      const key = els.managementKey.value.trim();
      const res = await fetch(base + path, {
        headers: key ? { Authorization: `Bearer ${key}` } : {}
      });
      const bodyText = await res.text();
      let data = null;
      try { data = bodyText ? JSON.parse(bodyText) : null; } catch { data = bodyText; }
      if (!res.ok) {
        const msg = data && data.error ? data.error : `${res.status} ${res.statusText}`;
        throw new Error(`${path}: ${msg}`);
      }
      return data;
    }

    function tokenBag(record) {
      const tokens = record && typeof record.tokens === 'object' ? record.tokens : record || {};
      const input = tokens.input_tokens ?? tokens.prompt_tokens ?? tokens.inputTokens ?? tokens.promptTokens ?? tokens.InputTokens ?? 0;
      const output = tokens.output_tokens ?? tokens.completion_tokens ?? tokens.outputTokens ?? tokens.completionTokens ?? tokens.OutputTokens ?? 0;
      const cached = tokens.cached_tokens ?? tokens.cache_read_input_tokens ?? tokens.cachedTokens ?? tokens.cacheHitTokens ?? tokens.CachedTokens ?? 0;
      const total = tokens.total_tokens ?? tokens.totalTokens ?? tokens.TotalTokens ?? (Number(input) + Number(output));
      return {
        input: Number(input) || 0,
        output: Number(output) || 0,
        cached: Number(cached) || 0,
        total: Number(total) || 0
      };
    }

    function accountName(record, fallback = '') {
      const source = record.source ?? record.Source ?? record.account ?? record.email ?? '';
      const apiKey = record.api_key ?? record.apiKey ?? '';
      const authId = record.auth_id ?? record.authId ?? record.AuthID ?? '';
      const authIndex = record.auth_index ?? record.authIndex ?? record.AuthIndex ?? '';
      const authType = record.auth_type ?? record.authType ?? '';
      if (source) return String(source);
      if (apiKey) return `api-key:${String(apiKey).slice(0, 8)}...`;
      if (authId) return `auth:${authId}`;
      if (authIndex || authType) return `${authType || 'auth'}:${authIndex || 'unknown'}`;
      return fallback || 'unknown';
    }

    function normalizeRecord(record, context = {}) {
      const tokens = tokenBag(record);
      return {
        timestamp: record.timestamp ?? record.time ?? record.created_at ?? record.RequestedAt ?? context.timestamp ?? '',
        account: accountName(record, context.account),
        model: record.model ?? record.Model ?? record.alias ?? context.model ?? 'unknown',
        provider: record.provider ?? record.Provider ?? record.source_type ?? context.provider ?? '',
        endpoint: record.endpoint ?? context.endpoint ?? '',
        requestId: record.request_id ?? record.requestId ?? '',
        failed: Boolean(record.failed ?? record.Failed ?? context.failed ?? false),
        input: tokens.input,
        output: tokens.output,
        cached: tokens.cached,
        total: tokens.total,
        raw: record
      };
    }

    function collectDetailsFromUsage(usage) {
      const records = [];
      const root = usage && usage.usage ? usage.usage : usage;
      const apis = root && root.apis && typeof root.apis === 'object' ? root.apis : {};
      for (const [endpoint, apiValue] of Object.entries(apis)) {
        const models = apiValue && apiValue.models && typeof apiValue.models === 'object' ? apiValue.models : {};
        for (const [model, modelValue] of Object.entries(models)) {
          const details = Array.isArray(modelValue.details) ? modelValue.details : [];
          for (const detail of details) {
            records.push(normalizeRecord(detail, { endpoint, model }));
          }
        }
      }
      return records;
    }

    function collectFromUsageQueue(queue) {
      const source = queue && typeof queue === 'object' && !Array.isArray(queue)
        ? (queue.records ?? queue.items ?? queue.data ?? queue['usage-queue'] ?? queue.queue)
        : queue;
      if (!Array.isArray(source)) return [];
      return source
        .filter(item => item && typeof item === 'object')
        .map(item => normalizeRecord(item));
    }

    function splitApiKeyBucket(key) {
      const [baseUrl, apiKey] = String(key || '').split('|');
      return {
        baseUrl: baseUrl || '',
        apiKey: apiKey || key || ''
      };
    }

    function collectFromApiKeyUsage(value) {
      if (!value || typeof value !== 'object' || Array.isArray(value)) return [];
      const records = [];
      Object.entries(value).forEach(([provider, buckets]) => {
        if (!buckets || typeof buckets !== 'object' || Array.isArray(buckets)) return;
        Object.entries(buckets).forEach(([bucketKey, bucket]) => {
          if (!bucket || typeof bucket !== 'object') return;
          const { baseUrl, apiKey } = splitApiKeyBucket(bucketKey);
          const account = apiKey ? `${provider}:${apiKey}` : `${provider}:${bucketKey}`;
          const recent = Array.isArray(bucket.recent_requests) ? bucket.recent_requests : [];
          if (recent.length) {
            recent.forEach(row => {
              records.push(normalizeRecord(row, {
                provider,
                account,
                endpoint: baseUrl,
                model: row.model ?? row.Model ?? 'bucket',
                failed: Number(row.failed || 0) > Number(row.success || 0)
              }));
            });
          } else {
            records.push(normalizeRecord(bucket, {
              provider,
              account,
              endpoint: baseUrl,
              model: bucket.model ?? bucket.Model ?? 'bucket',
              failed: Number(bucket.failed || 0) > Number(bucket.success || 0)
            }));
          }
        });
      });
      return records;
    }

    function collectAnyDetails(value, records = [], path = []) {
      if (!value || typeof value !== 'object') return records;
      if (Array.isArray(value)) {
        const looksLikeRecords = value.some(item => item && typeof item === 'object' && (item.tokens || item.input_tokens || item.output_tokens || item.model || item.endpoint));
        if (looksLikeRecords) {
          value.forEach(item => {
            if (item && typeof item === 'object') records.push(normalizeRecord(item));
          });
          return records;
        }
        value.forEach((item, index) => collectAnyDetails(item, records, path.concat(index)));
        return records;
      }
      if (Array.isArray(value.details)) {
        value.details.forEach(item => records.push(normalizeRecord(item)));
      }
      if (Array.isArray(value.recent_requests)) {
        value.recent_requests.forEach(item => {
          const key = path[path.length - 1] || '';
          records.push(normalizeRecord(item, { account: String(key) }));
        });
      }
      Object.entries(value).forEach(([key, item]) => {
        if (key !== 'details' && key !== 'recent_requests') collectAnyDetails(item, records, path.concat(key));
      });
      return records;
    }

    function dedupeRecords(records) {
      const seen = new Set();
      return records.filter(record => {
        const key = [
          record.requestId,
          record.timestamp,
          record.account,
          record.model,
          record.endpoint,
          record.input,
          record.output,
          record.cached
        ].join('|');
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function summarize(records) {
      const map = new Map();
      for (const record of records) {
        if (!map.has(record.account)) {
          map.set(record.account, { account: record.account, requests: 0, input: 0, output: 0, cached: 0 });
        }
        const row = map.get(record.account);
        row.requests += 1;
        row.input += record.input;
        row.output += record.output;
        row.cached += record.cached;
      }
      return Array.from(map.values()).sort((a, b) => (b.input + b.output) - (a.input + a.output));
    }

    function optionList(select, label, values) {
      const current = select.value;
      select.innerHTML = '';
      const all = document.createElement('option');
      all.value = '';
      all.textContent = label;
      select.appendChild(all);
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      if (values.includes(current)) select.value = current;
    }

    function renderAccounts(rows) {
      els.accountHint.textContent = `${rows.length} rows`;
      if (!rows.length) {
        els.accountRows.innerHTML = '<tr><td class="empty" colspan="5">暂无账号统计</td></tr>';
        return;
      }
      els.accountRows.innerHTML = rows.map(row => `
        <tr>
          <td class="account mono" title="${escapeHtml(row.account)}">${escapeHtml(row.account)}</td>
          <td>${fmt(row.requests)}</td>
          <td>${fmt(row.input)}</td>
          <td>${fmt(row.output)}</td>
          <td>${pct(row.cached, row.input)}</td>
        </tr>
      `).join('');
    }

    function filteredRecords() {
      const account = els.accountFilter.value;
      const model = els.modelFilter.value;
      const search = els.searchFilter.value.trim().toLowerCase();
      return state.records.filter(record => {
        if (account && record.account !== account) return false;
        if (model && record.model !== model) return false;
        if (!search) return true;
        const haystack = [record.provider, record.endpoint, record.requestId, record.account, record.model].join(' ').toLowerCase();
        return haystack.includes(search);
      });
    }

    function renderDetails() {
      const rows = filteredRecords();
      els.detailHint.textContent = `${rows.length} rows`;
      if (!rows.length) {
        els.detailRows.innerHTML = '<tr><td class="empty" colspan="10">暂无明细，确认已启用 usage-statistics-enabled 并且服务内存中有请求记录。</td></tr>';
        return;
      }
      els.detailRows.innerHTML = rows.slice(0, 1000).map(row => `
        <tr>
          <td class="mono">${escapeHtml(formatTime(row.timestamp))}</td>
          <td class="account mono" title="${escapeHtml(row.account)}">${escapeHtml(row.account)}</td>
          <td><span class="pill" title="${escapeHtml(row.model)}">${escapeHtml(row.model)}</span></td>
          <td>${fmt(row.input)}</td>
          <td>${fmt(row.output)}</td>
          <td>${fmt(row.cached)}</td>
          <td>${pct(row.cached, row.input)}</td>
          <td class="mono">${escapeHtml(text(row.provider))}</td>
          <td class="mono">${escapeHtml(text(row.endpoint))}</td>
          <td>${row.failed ? '<span style="color:var(--danger)">failed</span>' : '<span style="color:var(--success)">ok</span>'}</td>
        </tr>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function renderAll() {
      const rows = summarize(state.records);
      const total = rows.reduce((acc, row) => {
        acc.input += row.input;
        acc.output += row.output;
        acc.cached += row.cached;
        return acc;
      }, { input: 0, output: 0, cached: 0 });

      state.accounts = rows.map(row => row.account);
      state.models = Array.from(new Set(state.records.map(record => record.model).filter(Boolean))).sort();

      els.statAccounts.textContent = fmt(rows.length);
      els.statInput.textContent = fmt(total.input);
      els.statOutput.textContent = fmt(total.output);
      els.statCache.textContent = pct(total.cached, total.input);

      optionList(els.accountFilter, '全部账号', state.accounts);
      optionList(els.modelFilter, '全部模型', state.models);
      renderAccounts(rows);
      renderDetails();
    }

    async function refresh() {
      if (!els.managementKey.value.trim()) {
        setStatus('请先输入 Management key。页面不会在缺少密钥时请求管理接口，以免触发失败封禁。', 'error');
        els.managementKey.focus();
        return;
      }
      els.refreshBtn.disabled = true;
      const count = Math.max(1, Math.min(5000, Number(els.queueCount.value) || 1000));
      setStatus(`正在读取 /usage-queue?count=${count} 和 /api-key-usage ...`);
      try {
        localStorage.setItem('cliproxyapi-usage-base-url', normalizeBaseUrl(els.baseUrl.value));
        const results = await Promise.allSettled([
          apiGet(`/usage-queue?count=${count}`),
          apiGet('/api-key-usage')
        ]);

        const ok = results.filter(result => result.status === 'fulfilled').map(result => result.value);
        if (!ok.length) throw results[0].reason;

        let records = [];
        ok.forEach(payload => {
          records = records.concat(collectFromUsageQueue(payload));
          records = records.concat(collectDetailsFromUsage(payload));
          records = records.concat(collectAnyDetails(payload));
        });

        state.raw = ok;
        const newRecords = dedupeRecords(records);
        state.records = dedupeRecords(state.records.concat(newRecords))
          .sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));
        renderAll();

        const failures = results
          .filter(result => result.status === 'rejected')
          .map(result => result.reason.message);
        setStatus(
          failures.length
            ? `本次新增 ${newRecords.length} 条，当前页面保留 ${state.records.length} 条；部分接口不可用：${failures.join('；')}`
            : `本次新增 ${newRecords.length} 条，当前页面保留 ${state.records.length} 条。服务端 usage 队列已弹出这些新增记录。`,
          failures.length ? '' : 'ok'
        );
      } catch (err) {
        setStatus(`读取失败：${err.message || err}`, 'error');
      } finally {
        els.refreshBtn.disabled = false;
      }
    }

    function clearPage() {
      state.records = [];
      state.raw = null;
      renderAll();
      setStatus('页面已清空。注意：已经从服务端 usage 队列弹出的记录不会自动回到队列。');
    }

    els.baseUrl.value = localStorage.getItem('cliproxyapi-usage-base-url') || defaultBaseUrl();
    els.refreshBtn.addEventListener('click', refresh);
    els.clearBtn.addEventListener('click', clearPage);
    els.accountFilter.addEventListener('change', renderDetails);
    els.modelFilter.addEventListener('change', renderDetails);
    els.searchFilter.addEventListener('input', renderDetails);
    renderAll();
  </script>
</body>
</html>
